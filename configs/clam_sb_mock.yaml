# CLAM-SB on SYNTHETIC mock data (pipeline debugging only -- NOT reportable).
# Tiny settings so the whole train -> evaluate -> heatmap -> compare loop runs
# in well under a minute on CPU.

model:
  in_dim: 1024
  embed_dim: 64
  attention_dim: 32
  n_classes: 6
  dropout: 0.1
  gated: true
  k_sample: 4
  instance_loss: smooth_svm
  instance_loss_weight: 0.30
  subtyping: false

data:
  in_dim: 1024

training:
  max_epochs: 40
  patience: 10
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 1.0e-5
  max_patches: 512
  class_weights: balanced
  grad_clip: 5.0
  device: cpu
