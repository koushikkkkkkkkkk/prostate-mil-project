# ABMIL on GIGAP features (D = 1536).
# Generated by scripts/mkcfg.py from configs/abmil.yaml; only in_dim differs,
# so the hyperparameters are identical to the r50 baseline.

model:
  in_dim: 1536
  embed_dim: 512
  attention_dim: 256
  n_classes: 6
  dropout: 0.25
  gated: true
data:
  in_dim: 1536
training:
  max_epochs: 50
  patience: 12
  batch_size: 16
  lr: 0.0002
  weight_decay: 1.0e-05
  max_patches: 4096
  class_weights: balanced
  grad_clip: 5.0
  device: auto
