# Gated-attention ABMIL baseline (Person 1) -- reference hyperparameters.
# Use the identical data config as CLAM-SB so the comparison is paired.

model:
  in_dim: 1024
  embed_dim: 512
  attention_dim: 256
  n_classes: 6
  dropout: 0.25
  gated: true

data:
  in_dim: 1024

training:
  max_epochs: 50
  patience: 12
  batch_size: 16
  lr: 2.0e-4
  weight_decay: 1.0e-5
  max_patches: 4096
  class_weights: balanced
  grad_clip: 5.0
  device: auto
