# Simplified TransMIL on SYNTHETIC mock data -- NOT reportable.
model:
  in_dim: 1024
  d_model: 64
  n_heads: 4
  n_layers: 1
  ffn_multiplier: 2
  n_classes: 6
  dropout: 0.1

data:
  in_dim: 1024

training:
  max_epochs: 20
  patience: 6
  batch_size: 2
  lr: 1.0e-3
  weight_decay: 1.0e-5
  max_patches: 256
  class_weights: balanced
  grad_clip: 1.0
  device: cpu
